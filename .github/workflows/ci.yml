name: CI

on: [push, pull_request]

jobs:
  test:
    name: Node.js v${{ matrix.nodejs }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodejs: [22, 24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodejs }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: (cache) restore
        uses: actions/cache@master
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/package.json') }}

      - name: Install
        run: pnpm install

      - name: (coverage) Test inversify-typesafe
        run: pnpm run coverage

      # The spring-like package resolves this workspace dependency through its
      # published exports, which point at the root package's dist directory.
      - name: Build inversify-typesafe for workspace consumers
        run: pnpm --filter inversify-typesafe build

      - name: (coverage) Test inversify-typesafe-spring-like
        run: cd packages/inversify-typesafe-spring-like && pnpm run coverage

      - name: Upload coverage reports to Codecov (inversify-typesafe)
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          flags: inversify-typesafe

      - name: Upload coverage reports to Codecov (inversify-typesafe-spring-like)
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          flags: inversify-typesafe-spring-like
